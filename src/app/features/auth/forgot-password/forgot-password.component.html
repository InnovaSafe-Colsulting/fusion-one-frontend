<div class="auth-page">
  <div class="auth-card">
    <img src="images/fusionOneIcon-Photoroom.png" alt="FusionOne" class="auth-card__logo" />
    <h2 class="auth-card__title">¿Olvidaste tu contraseña?</h2>
    <p class="auth-card__subtitle">Ingresa tu correo y te enviaremos un enlace para restablecerla</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card__form" novalidate>
      <div class="form-group" [class.form-group--error]="email?.invalid && email?.touched">
        <div class="input-wrapper">
          <span class="input-wrapper__icon">✉</span>
          <input
            class="input-field"
            type="email"
            formControlName="email"
            placeholder="Correo electrónico"
            autocomplete="email"
          />
        </div>
        @if (email?.invalid && email?.touched) {
          <span class="form-group__error">Ingresa un correo válido</span>
        }
      </div>

      <button type="submit" class="btn btn-primary auth-card__submit" [disabled]="loading()">
        @if (loading()) { Enviando... } @else { ENVIAR ENLACE → }
      </button>
    </form>

    <a routerLink="/auth/login" class="auth-card__back">← Volver al inicio de sesión</a>
  </div>
</div>
